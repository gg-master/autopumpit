[platformio]
default_envs = uno

[env]
platform = atmelavr@5.1.0
board = uno
framework = arduino
build_flags = -I config -I src
lib_deps =
    adafruit/RTClib@2.1.4
    adafruit/Adafruit BusIO@1.17.4

[env:uno]

[env:uno-ds3231]
build_flags = ${env.build_flags} -DUSE_DS3231=1

[env:uno-en]
extends = env:uno
build_flags = ${env.build_flags} -DUI_LANGUAGE=0

[env:uno-ds3231-en]
extends = env:uno-ds3231
build_flags = ${env:uno-ds3231.build_flags} -DUI_LANGUAGE=0